<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kontakta Dalslandskören Blåklang via Instagram eller mejl.">
    <title>Dalslandskören Blåklang</title>
    <link rel="canonical" href="https://dalslandskoren.se/">
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
      :root {
        background: #f7f6f2;
        color: #192e47;
        font: 1rem/1.65 system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      main {
        min-width: 0;
        max-width: 34rem;
      }
      h1 {
        margin: 0;
        font: 400 clamp(2rem, 6vw, 3.25rem)/1.1 Georgia, serif;
        text-wrap: balance;
      }
      p {
        margin: 1.25rem 0;
        text-wrap: pretty;
      }
      address {
        display: grid;
        justify-items: center;
        gap: 0.25rem;
        font-style: normal;
      }
      a {
        max-width: 100%;
        padding: 0.2rem;
        color: #244e76;
        overflow-wrap: anywhere;
        text-underline-offset: 0.2em;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hemsidan är under utveckling!</h1>
      <p>För information och kontakt hänvisar vi dig till vår Instagram och mejladress.</p>
      <address>
        <a href="https://www.instagram.com/dalslandskoren/">Instagram · @dalslandskoren</a>
        <a href="mailto:dalslandskorenblaklang@gmail.com">dalslandskorenblaklang@gmail.com</a>
      </address>
    </main>
  </body>
</html>
